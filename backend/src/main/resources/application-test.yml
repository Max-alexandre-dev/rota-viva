# Perfil "test": banco H2 em memoria, sem depender do PostgreSQL.
# Ativar: mvn spring-boot:run -Dspring-boot.run.profiles=test
#     ou: SPRING_PROFILES_ACTIVE=test mvn spring-boot:run
# Os dados somem ao encerrar a aplicacao.
spring:
  datasource:
    url: jdbc:h2:mem:rota_viva;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
